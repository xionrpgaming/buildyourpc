<!DOCTYPE html>
<html lang="id">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<header class="site-header">
  <a href="index.html" class="logo"><span class="dot">■</span> Xion Gaming</a>

  </nav>

<div class="builder-shell">

  <aside id="filter-panel"></aside>

      <h2 id="grid-title">Processor (CPU)</h2>

      <div id="score-wrap"></div>
